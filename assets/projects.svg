<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230">
  <rect width="800" height="230" rx="10" fill="#0f1117"/>
  
  <!-- AegisFlow -->
  <g class="card" transform="translate(10, 10)">
    <rect width="385" height="210" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="20" y="35" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#58a6ff">⚙ AegisFlow</text>
    
    <text x="20" y="65" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8b949e">FastAPI · Redis Streams · PostgreSQL</text>
    <text x="20" y="80" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8b949e">Docker · AWS</text>
    
    <text x="20" y="115" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">Distributed async task orchestration engine.</text>
    <text x="20" y="135" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">Exactly-once execution, circuit breakers,</text>
    <text x="20" y="155" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">exponential-backoff DLQ, JWT REST API.</text>
    
    
    <g transform="translate(20, 175)">
      <rect width="129" height="24" rx="4" fill="#0f1117" stroke="#238636" stroke-width="1"/>
      <text x="64.5" y="16" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="bold" fill="#3fb950">2400+ tasks/min</text>
    </g>
    
    
    <g transform="translate(155, 175)">
      <rect width="80" height="24" rx="4" fill="#0f1117" stroke="#238636" stroke-width="1"/>
      <text x="40.0" y="16" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="bold" fill="#3fb950">P95 22ms</text>
    </g>
    
    
    <g transform="translate(245, 175)">
      <rect width="94" height="24" rx="4" fill="#0f1117" stroke="#238636" stroke-width="1"/>
      <text x="47.0" y="16" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="bold" fill="#3fb950">50 workers</text>
    </g>
    
  </g>

  <!-- CortexGate -->
  <g class="card" transform="translate(405, 10)">
    <rect width="385" height="210" rx="8" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="20" y="35" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#58a6ff">🛡 CortexGate</text>
    
    <text x="20" y="65" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8b949e">FastAPI · Redis · PostgreSQL · JWT</text>
    <text x="20" y="80" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8b949e">Docker · AWS</text>
    
    <text x="20" y="115" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">Multi-tenant API gateway with Redis</text>
    <text x="20" y="135" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">caching, dynamic upstream failover,</text>
    <text x="20" y="155" font-family="'Segoe UI', sans-serif" font-size="13" fill="#c9d1d9">per-tenant rate limiting, usage metering.</text>
    
    
    <g transform="translate(20, 175)">
      <rect width="108" height="24" rx="4" fill="#0f1117" stroke="#238636" stroke-width="1"/>
      <text x="54.0" y="16" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="bold" fill="#3fb950">99.9% uptime</text>
    </g>
    
    
    <g transform="translate(130, 175)">
      <rect width="122" height="24" rx="4" fill="#0f1117" stroke="#238636" stroke-width="1"/>
      <text x="61.0" y="16" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="bold" fill="#3fb950">38% cache wins</text>
    </g>
    
    
    <g transform="translate(255, 175)">
      <rect width="101" height="24" rx="4" fill="#0f1117" stroke="#238636" stroke-width="1"/>
      <text x="50.5" y="16" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="bold" fill="#3fb950">31% latency</text>
    </g>
    
  </g>
</svg>