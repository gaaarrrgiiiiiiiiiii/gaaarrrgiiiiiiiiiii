<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6" />
      <stop offset="50%" style="stop-color:#60a5fa" />
      <stop offset="100%" style="stop-color:#93c5fd" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="200" fill="url(#bg)" rx="0"/>
  
  <!-- ASCII Art Name -->
  <text x="400" y="85" text-anchor="middle" font-family="'Courier New', monospace" font-size="48" font-weight="bold" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="8">
    GARGI
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="125" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" fill="#9ca3af" letter-spacing="4">
    GARGI THAPA  /  <tspan fill="#4ade80">AI &amp; BACKEND ENGINEER</tspan>  /  CHENNAI, INDIA
  </text>
  
  <!-- Decorative line -->
  <line x1="200" y1="145" x2="600" y2="145" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Tech badges row -->
  <text x="400" y="172" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#64748b" letter-spacing="2">
    FastAPI  ·  RAG + LLMs  ·  AWS Certified  ·  Docker + Redis  ·  Distributed Systems
  </text>
</svg>
