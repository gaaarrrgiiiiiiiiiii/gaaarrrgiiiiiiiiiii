      <stop offset="0" stop-color="#222147"/>
      <stop offset="0.56" stop-color="#151a34"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a9a"/>
      <stop offset="0.5" stop-color="#a076ff"/>
      <stop offset="1" stop-color="#69e6ef"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132f49"/>
      <stop offset="1" stop-color="#17223f"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="938" height="352" rx="24" fill="#0b1020" stroke="#303853" stroke-width="2"/>

  <rect x="18" y="18" width="440" height="318" rx="20" fill="url(#main)" stroke="#48466f"/>
  <circle cx="393" cy="87" r="89" fill="none" stroke="#9b80ee" stroke-opacity=".18" stroke-width="1.5"/>
  <circle cx="393" cy="87" r="63" fill="none" stroke="#72e4ea" stroke-opacity=".26" stroke-width="1.5"/>
