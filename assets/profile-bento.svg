  <text x="729" y="255" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="21" font-weight="700">Driftt</text>
  <text x="729" y="281" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="21" font-weight="700">Pramana</text>
  <text x="729" y="307" fill="#f7f5ff" font-family="Arial, sans-serif" font-size="21" font-weight="700">AURORA</text>
