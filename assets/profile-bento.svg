  <circle cx="393" cy="87" r="7" fill="#72e4ea"/>
  <circle cx="334" cy="36" r="4" fill="#ff88aa"/>
  <circle cx="421" cy="148" r="3" fill="#b797ff"/>
  <text x="44" y="60" fill="#9edbe8" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3">01 / THE WORK</text>
  <text x="44" y="124" fill="#f5f5ff" font-family="Arial, sans-serif" font-size="40" font-weight="800">Useful AI.</text>
  <text x="44" y="171" fill="#f5f5ff" font-family="Arial, sans-serif" font-size="40" font-weight="800">Clear thinking.</text>
  <text x="44" y="210" fill="#c9cfdf" font-family="Arial, sans-serif" font-size="17">Interfaces, APIs, and systems that make</text>
  <text x="44" y="235" fill="#c9cfdf" font-family="Arial, sans-serif" font-size="17">complex information easier to use.</text>
  <rect x="44" y="277" width="69" height="29" rx="14" fill="#292b53" stroke="#6f69b6"/>
  <text x="64" y="297" fill="#f2eaff" font-family="Arial, sans-serif" font-size="13" font-weight="700">AI</text>
  <rect x="123" y="277" width="69" height="29" rx="14" fill="#1c3946" stroke="#4d9caa"/>
  <text x="142" y="297" fill="#dcfbff" font-family="Arial, sans-serif" font-size="13" font-weight="700">APIs</text>
  <rect x="202" y="277" width="95" height="29" rx="14" fill="#3d2a48" stroke="#b16b9c"/>
  <text x="220" y="297" fill="#ffe4f1" font-family="Arial, sans-serif" font-size="13" font-weight="700">Product</text>

  <rect x="474" y="18" width="448" height="150" rx="20" fill="url(#cool)" stroke="#35566b"/>
  <text x="498" y="48" fill="#8ae6e9" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3">02 / MY NORTH STAR</text>
  <text x="498" y="96" fill="#f7f7ff" font-family="Arial, sans-serif" font-size="27" font-weight="800">Show the evidence.</text>
  <text x="498" y="127" fill="#cad5df" font-family="Arial, sans-serif" font-size="15">Answers should lead back to their sources.</text>
  <path d="M820 57 L852 76 L820 95 M789 57 L757 76 L789 95" fill="none" stroke="url(#warm)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".88"/>

  <rect x="474" y="184" width="215" height="152" rx="20" fill="#1b223b" stroke="#454a77"/>
  <text x="498" y="216" fill="#bda6ff" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">03 / EXPLORING</text>
  <text x="498" y="259" fill="#f5f5ff" font-family="Arial, sans-serif" font-size="25" font-weight="800">Reliable</text>
  <text x="498" y="289" fill="#f5f5ff" font-family="Arial, sans-serif" font-size="25" font-weight="800">backends.</text>
  <path d="M621 302 H654 M629 310 H662" stroke="#af8cff" stroke-width="3" stroke-linecap="round" opacity=".8"/>

