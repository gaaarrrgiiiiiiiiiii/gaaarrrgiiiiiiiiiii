name: Update README Stats

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Update contribution stats
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: gaaarrrgiiiiiiiiiii
        run: python scripts/update_stats.py

      - name: Commit and push
        run: |
          git config --local user.email "gargith24@gmail.com"
          git config --local user.name "gaaarrrgiiiiiiiiiii"
          git add -A
          git diff --staged --quiet || git commit -m "📊 auto-update contribution stats"
          git push
